name: Build and Publish EXE Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
          $env:PYTHONPATH = "."
          python -m pytest tests/ -v

      - name: Build & self-test amv-gn-bridge.exe
        run: |
          python scripts/build/build_exe.py

      - name: Package browser extension zip
        run: |
          Compress-Archive -Path extension\* -DestinationPath dist\amv-gn-bridge-extension.zip -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amv-gn-bridge-windows-dist
          path: |
            dist/amv-gn-bridge.exe
            dist/amv-gn-bridge.exe.sha256
            dist/amv-gn-bridge-extension.zip
            dist/build_report.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/amv-gn-bridge.exe
            dist/amv-gn-bridge.exe.sha256
            dist/amv-gn-bridge-extension.zip
            dist/build_report.json
